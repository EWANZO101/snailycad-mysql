services:
  mariadb:
    container_name: "snaily-cad-mariadb"
    image: mariadb:11.4
    environment:
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "${DB_PORT}:3306"
    networks:
      - cad_web
    volumes:
      - ./.data:/var/lib/mysql
    restart: unless-stopped

  api:
    container_name: "snaily-cad-api"
    build:
      context: .
      dockerfile: ./Dockerfile
      target: api
    ports:
      - "${PORT_API}:${PORT_API}"
    expose:
      - ${PORT_API}
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - cad_web
    restart: always
    environment:
      # keeps the recovery token (shown once on /admin) across image rebuilds
      RECOVERY_TOKEN_FILE: /snailycad/data/.recovery-token
    volumes:
      - ./apps/api/public:/snailycad/apps/api/public
      - ./.snailycad-data:/snailycad/data

  client:
    container_name: "snaily-cad-client"
    build:
      context: .
      dockerfile: ./Dockerfile
      target: client
    ports:
      - "${PORT_CLIENT}:${PORT_CLIENT}"
    expose:
      - ${PORT_CLIENT}
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - cad_web
    restart: always

networks:
  cad_web:
    external: true
