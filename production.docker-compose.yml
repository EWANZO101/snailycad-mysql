services:
  mariadb:
    container_name: "snaily-cad-mariadb"
    image: mariadb:11.4
    environment:
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      # localhost only by default; set DB_BIND="0.0.0.0" to reach the database from other machines
      - "${DB_BIND:-127.0.0.1}:${DB_HOST_PORT:-${DB_PORT}}:3306"
    networks:
      - cad_web
    volumes:
      - ./.data:/var/lib/mysql
    restart: unless-stopped

  api:
    container_name: "snaily-cad-api"
    build:
      context: .
      dockerfile: ./Dockerfile
      target: api
      # build on the server's own network: on hosts where Docker's bridge network stalls (MTU,
      # provider firewalls) the package downloads would hang and fail the build
      network: host
    ports:
      - "${PORT_API}:${PORT_API}"
    expose:
      - ${PORT_API}
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - cad_web
    restart: always
    environment:
      # keeps the recovery token (shown once on /admin) across image rebuilds
      RECOVERY_TOKEN_FILE: /snailycad/data/.recovery-token
    volumes:
      - ./apps/api/public:/snailycad/apps/api/public
      - ./.snailycad-data:/snailycad/data

  client:
    container_name: "snaily-cad-client"
    build:
      context: .
      dockerfile: ./Dockerfile
      target: client
      # build on the server's own network: on hosts where Docker's bridge network stalls (MTU,
      # provider firewalls) the package downloads would hang and fail the build
      network: host
    ports:
      - "${PORT_CLIENT}:${PORT_CLIENT}"
    expose:
      - ${PORT_CLIENT}
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - cad_web
    restart: always

  # Optional LiveKit server for the radio (CAD Settings > Radio > LiveKit server). Start it with:
  #   cp livekit.example.yaml livekit.yaml   (and change the secret)
  #   docker compose -f production.docker-compose.yml --profile livekit up -d
  # then set RADIO_LIVEKIT_URL / _API_KEY / _API_SECRET in .env and rebuild/restart the API.
  livekit:
    container_name: "snaily-cad-livekit"
    image: livekit/livekit-server:v1.13.7
    profiles: ["livekit"]
    command: --config /etc/livekit.yaml
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50100:50000-50100/udp"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    networks:
      - cad_web
    restart: unless-stopped

networks:
  cad_web:
    external: true
