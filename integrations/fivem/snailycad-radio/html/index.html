<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SnailyCAD Radio</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- small always-on display: channel and who is talking -->
    <div id="hud" class="hud" hidden>
      <span class="hud-dot" aria-hidden="true"></span>
      <span id="hud-channel"></span>
      <span id="hud-status" class="hud-status"></span>
      <span id="hud-earpiece" class="hud-earpiece" hidden title="Earpiece">🎧</span>
    </div>

    <!-- the handheld, shown with /radio -->
    <div id="radio" class="radio" role="dialog" aria-label="Radio">
      <button id="close" class="close" type="button" aria-label="Close">×</button>
      <div class="antenna" aria-hidden="true"></div>
      <div class="knobs" aria-hidden="true">
        <div class="knob"></div>
        <div class="knob small"></div>
      </div>
      <div class="body">
        <div id="led" class="led" aria-hidden="true"></div>
        <div class="brand">SNAILY · CAD</div>
        <div id="lcd" class="lcd">
          <div id="lcd-top" class="lcd-top"></div>
          <div id="lcd-bottom" class="lcd-bottom"></div>
        </div>
        <div class="buttons">
          <button id="channel-down" type="button" aria-label="Previous channel">◀</button>
          <button id="power" type="button" aria-label="Power" class="active">⏻</button>
          <button id="channel-up" type="button" aria-label="Next channel">▶</button>
        </div>
        <div class="row">
          <button id="earpiece" type="button" class="pill">🎧 EAR</button>
          <label class="pill volume" title="Volume">
            🔊
            <input id="volume" type="range" min="0" max="1" step="0.05" value="0.8" />
          </label>
        </div>
        <div class="grille" aria-hidden="true"></div>
      </div>
      <button id="ptt" class="ptt" type="button" aria-label="Push to talk">PTT</button>
    </div>

    <!-- radio setup for server admins (/radiosetup) -->
    <div id="setup" class="setup" role="dialog" aria-labelledby="setup-title" hidden>
      <form id="setup-form" class="setup-card" autocomplete="off">
        <h2 id="setup-title">SnailyCAD Radio setup</h2>
        <p class="setup-intro">
          Connect this server to your SnailyCAD. You find both values in the CAD:
          <b>CAD Settings → API Token</b> (turn it on) and your CAD's API address.
        </p>
        <label>
          CAD API address
          <input id="setup-url" type="url" placeholder="https://cad-api.example.com/v1" required />
        </label>
        <label>
          CAD API token
          <input id="setup-token" type="password" placeholder="sng_…" />
          <small id="setup-token-hint"></small>
        </label>
        <p id="setup-source" class="setup-source"></p>
        <p id="setup-message" class="setup-message" role="status"></p>
        <div class="setup-buttons">
          <button type="button" id="setup-close" class="secondary">Close</button>
          <button type="button" id="setup-test" class="secondary">Test</button>
          <button type="submit" id="setup-save">Save</button>
        </div>
      </form>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
